<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>black hole</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #272822; }
    /* The canvas holds device pixels; CSS shows it at the page's size. */
    canvas { display: block; outline: none; width: 100vw; height: 100vh; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; color: #75715e;
              font: 14px ui-monospace, Menlo, monospace; }
  </style>
</head>
<body>
  <!-- A page for local testing. black-hole-sim.js is self-contained: it embeds the WebAssembly and
       creates its own canvas if a page has none, so this markup is optional. -->
  <div id="status">// loading</div>
  <canvas id="canvas"></canvas>
  <script>
    var Module = {
      onRuntimeInitialized() { document.getElementById('status').remove(); Module.canvas.focus(); },
      setStatus(text) { if (text) document.getElementById('status')?.replaceChildren('// ' + text.toLowerCase()); },
    };
  </script>
  <script src="black-hole-sim.js"></script>
</body>
</html>
